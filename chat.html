<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fixit Volt Matcher job chat.">
  <title>Chat - Fixit Volt Matcher</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ui-enhancements.css">
  <script src="js/config.js"></script>
</head>
<body class="chat-page-body">
  <div class="chat-container">
    <header class="chat-header">
      <button class="btn-secondary" id="backBtn" type="button">Back</button>
      <div class="chat-title-wrap">
        <h1 id="chatTitle">Loading chat...</h1>
        <span class="badge badge-status-pending" id="chatStatus">Pending</span>
      </div>
      <button class="mobile-menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="chatMobileMenu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="mobile-menu" id="chatMobileMenu" aria-hidden="true">
        <button class="mobile-menu-link" type="button" data-mobile-back="true">Back</button>
      </div>
    </header>

    <main class="messages-area" id="messagesArea" aria-live="polite"></main>

    <div class="chat-input-area">
      <form class="chat-form" id="messageForm" novalidate>
        <div class="chat-form-inner">
          <div class="chat-attachment-dropdown">
            <button class="chat-plus-btn" id="attachmentMenuBtn" type="button" aria-label="Attachment options">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <div class="attachment-menu hidden" id="attachmentMenu">
              <button class="attachment-menu-item" id="chatImageTrigger" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                Upload Image
              </button>
            </div>
          </div>
          
          <div class="chat-input-wrapper">
            <label class="hidden" for="messageInput">Message</label>
            <textarea id="messageInput" placeholder="Type your message..."></textarea>
            <button class="chat-send-btn btn-primary" id="sendBtn" type="submit" aria-label="Send message">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>

        <input class="hidden" type="file" id="chatImageInput" accept="image/*">

        <div class="chat-image-preview-wrap" id="chatImagePreviewWrap">
          <img class="chat-image-preview" id="chatImagePreview" alt="Selected chat image preview">
          <div class="image-preview-meta">
            <div class="image-preview-text">
              <span class="image-preview-name" id="chatImagePreviewName"></span>
              <span class="image-preview-size" id="chatImagePreviewSize"></span>
            </div>
            <button class="image-remove-btn" id="chatRemoveImageBtn" type="button" aria-label="Remove selected image">&times;</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <script src="js/chat.js"></script>
</body>
</html>
